# Builds and tests every push and pull request, on Linux and on Windows (where Lockbox actually runs).
# Releases are NOT made here: they're signed with an offline key on the developer's machine
# (see docs/RELEASING.md), so GitHub never holds it.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build Lockbox.slnx -c Release
      - name: Tests (unit + headless end-to-end)
        run: dotnet test Lockbox.slnx -c Release --no-build
      - name: Windows app publishes
        if: runner.os == 'Windows'
        run: dotnet publish src/Lockbox.App -c Release -r win-x64 --self-contained -o publish/ci -p:DebugType=none

  extension:
    name: Browser extension packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Scripts parse
        run: for f in $(find extension -name '*.js'); do node --check "$f"; done
      - name: Package for the stores
        run: dotnet run --project tools/Lockbox.Release -- extension --out ext
      - name: Firefox add-on passes Mozilla's checks
        run: npx --yes addons-linter@10 ext/lockbox-extension-firefox-*.zip
