# Builds and tests every push and pull request, on Linux and on Windows (where Lockbox actually runs).
# Releases are NOT made here: they're signed with an offline key on the developer's machine
# (see docs/RELEASING.md), so GitHub never holds it.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30   # a normal run takes a few minutes; never let a stuck one run for hours
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build Lockbox.slnx -c Release
      - name: Tests (unit + headless end-to-end)
        run: dotnet test Lockbox.slnx -c Release --no-build --blame-hang-timeout 10m --blame-hang-dump-type none
        env:
          LOCKBOX_UITEST_PROGRESS: ${{ runner.temp }}/uitest-progress.txt
      - name: How far the headless test got
        if: always()
        shell: bash
        run: cat "$RUNNER_TEMP/uitest-progress.txt" 2>/dev/null || echo "(the headless test didn't start)"
      - name: Windows app publishes
        if: runner.os == 'Windows'
        run: dotnet publish src/Lockbox.App -c Release -r win-x64 --self-contained -o publish/ci -p:DebugType=none

  extension:
    name: Browser extension packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Scripts parse
        run: for f in $(find extension -name '*.js'); do node --check "$f"; done
      - name: Package for the stores
        run: dotnet run --project tools/Lockbox.Release -- extension --out ext
      - name: Firefox add-on passes Mozilla's checks
        run: npx --yes addons-linter@10 ext/lockbox-extension-firefox-*.zip
