# Builds and tests every push and pull request. Releases are NOT made here: they're signed with an
# offline key on the developer's machine (see "Releasing" in README.md), so GitHub never holds it.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build Lockbox.slnx -c Release
      - name: Unit tests
        run: dotnet test tests/Lockbox.Tests -c Release --no-build
      - name: End-to-end UI checks (headless)
        run: dotnet run --project tools/Lockbox.Screenshots -c Release --no-build -- smoke
